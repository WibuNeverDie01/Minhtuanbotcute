<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trắc Nghiệm HĐTN 10 - Thước Đo "Sống Thực"</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success-bg: #dcfce7;
      --success-border: #16a34a;
      --success-text: #166534;
      --danger-bg: #fee2e2;
      --danger-border: #dc2626;
      --danger-text: #991b1b;
      --warn-bg: #fef9c3;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 12px 32px;
    }

    header {
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
      color: #fff;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.22);
      margin-bottom: 14px;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    header p {
      margin: 0;
      opacity: 0.92;
      font-size: 0.88rem;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      align-items: end;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    select, button {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
    }

    select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      width: 100%;
    }

    .checkbox-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .checkbox-stack label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .checkbox-stack input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 11px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: var(--text); flex: 1; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }

    /* Result Box hài hước */
    .result-box {
      display: none;
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.15);
    }

    .result-box.show { display: block; }

    .rank-title {
      display: inline-block;
      margin: 6px 0;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .rank-fake { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .rank-mid { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .rank-real { background: #dcfce7; color: #166534; border: 1px solid #86efac; }

    .score-big {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      margin: 4px 0;
    }

    .rank-roast {
      font-size: 0.95rem;
      color: #334155;
      max-width: 640px;
      margin: 6px auto 14px;
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 18px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .badge {
      background: #ede9fe;
      color: #5b21b6;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .nav-item {
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text);
    }

    .nav-item.answered { background: #ede9fe; border-color: #a78bfa; color: #4c1d95; }
    .nav-item.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .nav-item.wrong { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
      scroll-margin-top: 16px;
    }

    .q-topic {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #6d28d9;
      background: #f3e8ff;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .q-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .q-num {
      color: var(--primary);
      margin-right: 4px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      min-height: 46px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.12s ease;
      background: #fff;
      font-size: 0.96rem;
    }

    .opt-label input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      accent-color: var(--primary);
    }

    .opt-label.selected {
      border-color: var(--primary);
      background: #f5f3ff;
    }

    .opt-label.correct-opt {
      border-color: var(--success-border);
      background: var(--success-bg);
      color: var(--success-text);
      font-weight: 600;
    }

    .opt-label.wrong-opt {
      border-color: var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .q-feedback {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }

    .q-feedback.show { display: block; }
    .q-feedback.ok { background: #fee2e2; color: #991b1b; }
    .q-feedback.err { background: #dcfce7; color: #166534; }
    .q-feedback.warn { background: var(--warn-bg); color: #854d0e; }

    .end-submit-wrap {
      margin-top: 16px;
      display: none;
    }

    .mobile-bottom-bar {
      display: none;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 420px;
      max-height: 82vh;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-grid-scroll {
      overflow-y: auto;
      padding: 4px 0;
    }

    @media (max-width: 900px) {
      .container {
        padding: 12px 10px 88px;
      }

      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }

      .end-submit-wrap {
        display: flex;
        gap: 10px;
      }

      .mobile-bottom-bar {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: #ffffff;
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.08);
        padding: 8px 12px;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        z-index: 900;
      }

      .mob-pill {
        background: #f1f5f9;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 0.88rem;
        color: var(--text);
        cursor: pointer;
      }

      .mob-timer {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
        white-space: nowrap;
      }

      .mob-submit {
        height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: none;
        background: #16a34a;
        color: #fff;
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        flex: 1;
        max-width: 170px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TRẮC NGHIỆM HĐTN 10 – THƯỚC ĐO "SỐNG THỰC"</h1>
      <p>27 câu chuẩn đề GK I • Điểm càng cao = Đạo đức giả • Điểm càng thấp = Trung thực, sống thực 😎</p>
    </header>

    <div class="toolbar">
      <div class="control-group">
        <label for="examCode">Chọn Mã Đề</label>
        <select id="examCode">
          <option value="000">Mã đề gốc (000 - Không xáo)</option>
          <option value="101" selected>Mã đề 101</option>
          <option value="102">Mã đề 102</option>
          <option value="103">Mã đề 103</option>
          <option value="104">Mã đề 104</option>
          <option value="105">Mã đề 105</option>
          <option value="random">Mã đề ngẫu nhiên mới</option>
        </select>
      </div>

      <div class="control-group">
        <label for="quizMode">Chế độ làm bài</label>
        <select id="quizMode">
          <option value="exam">Thi thử (Nộp bài mới phán xét)</option>
          <option value="practice">Ôn tập (Chọn xong bóc phốt ngay)</option>
        </select>
      </div>

      <div class="checkbox-stack">
        <label><input type="checkbox" id="shuffleQuestions" checked /> Xáo trộn thứ tự câu hỏi</label>
        <label><input type="checkbox" id="shuffleOptions" checked /> Xáo trộn đáp án (A, B, C, D)</label>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="generateNewRandomCode()">🎲 Đổi mã đề</button>
        <button class="btn btn-secondary" onclick="resetCurrentExam()">🔄 Làm lại</button>
      </div>
    </div>

    <div id="resultBox" class="result-box">
      <div style="font-size:0.86rem;font-weight:700;color:#64748b;">PHÁN QUYẾT NHÂN PHẨM (<span id="resCodeText">Mã đề 101</span>)</div>
      <div id="rankTitle" class="rank-title rank-fake">🎭 ĐẠO ĐỨC GIẢ</div>
      <div class="score-big" id="scoreText">0.0 / 10</div>
      <div id="detailText" style="font-size:0.9rem;font-weight:600;color:#475569;"></div>
      <div id="rankRoast" class="rank-roast"></div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-secondary" style="max-width:180px;" onclick="resetCurrentExam()">🔄 Thử sống lại</button>
        <button class="btn btn-primary" style="max-width:180px;" onclick="generateNewRandomCode()">🎲 Đổi mã đề mới</button>
      </div>
    </div>

    <div class="layout">
      <div>
        <main id="questionsContainer" class="questions-list"></main>

        <div class="end-submit-wrap">
          <button id="endSubmitBtn" class="btn btn-success" style="flex:1;" onclick="requestSubmit()">✅ Nộp bài & Xem nhân phẩm</button>
          <button class="btn btn-secondary" onclick="resetCurrentExam()">🔄 Làm lại</button>
        </div>
      </div>

      <aside class="sidebar">
        <div class="stats-bar">
          <span id="currentCodeLabel" class="badge">Mã đề: 101</span>
          <span id="timerLabel">⏱ 00:00</span>
        </div>

        <div style="font-size:0.85rem;font-weight:600;color:#64748b;margin-bottom:8px;">
          Bảng câu hỏi (<span id="answeredCount">0</span>/<span id="totalQCountSide">27</span>)
        </div>
        <div id="navGridDesktop" class="nav-grid"></div>

        <div class="btn-row" style="flex-direction:column;">
          <button id="submitBtnDesktop" class="btn btn-success" onclick="requestSubmit()">✅ Nộp bài & Xem nhân phẩm</button>
          <button class="btn btn-secondary" onclick="resetCurrentExam()">🔄 Làm lại từ đầu</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Thanh dưới đáy cho điện thoại -->
  <div class="mobile-bottom-bar">
    <button class="mob-pill" onclick="openNavModal()">
      📋 <span id="mobCodeShort">101</span> • <span id="mobAnsweredCount">0</span>/<span id="totalQCountMob">27</span>
    </button>
    <span id="mobTimerLabel" class="mob-timer">⏱ 00:00</span>
    <button id="mobSubmitBtn" class="mob-submit" onclick="handleMobileMainAction()">✅ Nộp bài</button>
  </div>

  <!-- Modal Bảng câu hỏi trên điện thoại -->
  <div id="navModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'navModal')">
    <div class="modal-box">
      <div class="modal-header">
        <span>Chọn nhanh câu hỏi (<span id="modalAnsweredCount">0</span>/<span id="totalQCountModal">27</span>)</span>
        <button class="modal-close" onclick="closeModal('navModal')">✕</button>
      </div>
      <div class="modal-grid-scroll">
        <div id="navGridMobile" class="nav-grid"></div>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button id="modalSubmitBtn" class="btn btn-success" style="flex:1;" onclick="closeModal('navModal'); requestSubmit();">✅ Nộp bài ngay</button>
        <button class="btn btn-secondary" onclick="closeModal('navModal')">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Modal Xác nhận nộp bài -->
  <div id="confirmModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'confirmModal')">
    <div class="modal-box" style="max-width:360px;">
      <div class="modal-header">
        <span>Xác nhận nộp bài</span>
        <button class="modal-close" onclick="closeModal('confirmModal')">✕</button>
      </div>
      <p id="confirmMessage" style="margin:0 0 16px;color:#334155;font-size:0.96rem;"></p>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Làm tiếp</button>
        <button class="btn btn-success" style="flex:1;" onclick="finalizeSubmit()">Nộp bài luôn</button>
      </div>
    </div>
  </div>

  <script>
    // Ngân hàng 27 câu hỏi chuẩn từ đề HĐTN 10 NH 26-27
    // keepOptionOrder: true với các câu có phương án "Tất cả các ý trên..." hoặc "A và B đều đúng" để không bị loạn khi xáo trộn
    const RAW_QUESTIONS = [
      // CHỦ ĐỀ 1: PHÁT HUY TRUYỀN THỐNG NHÀ TRƯỜNG
      {
        topic: "Chủ đề 1: Truyền thống nhà trường",
        q: "Ý nào dưới đây là truyền thống của nhà trường?",
        opts: [
          "Truyền thống dạy tốt, học tốt.",
          "Truyền thống hoạt động của Đoàn thanh niên, phong trào văn hóa, văn nghệ, thể thao.",
          "Truyền thống tương thân tương ái – Uống nước nhớ nguồn.",
          "Tất cả các ý trên đều đúng."
        ],
        ans: 3,
        keepOptionOrder: true
      },
      {
        topic: "Chủ đề 1: Truyền thống nhà trường",
        q: "Nhân ngày 20/11, nhà trường tổ chức biểu diễn văn nghệ chào mừng ngày 20/11 nhưng bạn Lan không tham gia vì không thích. Nếu là em, em sẽ khuyên bạn Lan như thế nào?",
        opts: [
          "Ủng hộ việc làm của Lan",
          "Đồng tình với việc làm đó vì cho rằng mỗi bạn một sở thích.",
          "Nói cho Lan hiểu về ý nghĩa của hoạt động này và khuyên Lan cùng tham gia.",
          "Không chơi với bạn Lan nữa."
        ],
        ans: 2
      },
      {
        topic: "Chủ đề 1: Truyền thống nhà trường",
        q: "Bản thân em đã làm gì để tự hào về truyền thống của trường mình?",
        opts: [
          "Chăm ngoan, học giỏi và tích cực tham gia các hoạt động",
          "Tìm hiểu nhiều hơn nữa về truyền thống của trường",
          "Giới thiệu với bạn bè về truyền thống của trường",
          "Tất cả những ý trên đều đúng."
        ],
        ans: 3,
        keepOptionOrder: true
      },
      {
        topic: "Chủ đề 1: Truyền thống nhà trường",
        q: "Cần phải làm gì để đóng góp xây dựng và phát huy truyền thống nhà trường.",
        opts: [
          "không đi học đầy đủ",
          "tích cực tham gia các hoạt động",
          "Lôi kéo các bạn không tham gia các hoạt động",
          "Thờ ơ với các hoạt động nhà trường tổ chức."
        ],
        ans: 1
      },
      {
        topic: "Chủ đề 1: Truyền thống nhà trường",
        q: "Phòng truyền thống nhà trường là:",
        opts: [
          "là nơi lưu giữ rất nhiều những thành tích, những huân huy chương của cá nhân và tập thể của cá nhân và nhà trường.",
          "là nơi lưu giữ và trưng bày các hình ảnh, tư liệu các hoạt động của nhà trường",
          "là nơi tái hiện và lưu giữ lịch sử của nhà trường",
          "tất cả các ý trên đều đúng."
        ],
        ans: 3,
        keepOptionOrder: true
      },
      {
        topic: "Chủ đề 1: Truyền thống nhà trường",
        q: "Nhà trường có truyền thống hoạt động thể dục thể thao rất sôi nổi, em sẽ",
        opts: [
          "tích cực tham gia để phát huy truyền thống",
          "không tham gia khi phát động phong trào.",
          "lôi kéo các bạn không nên tham gia vì ảnh hưởng đến việc học",
          "im lặng, không có ý kiến gì."
        ],
        ans: 0
      },
      {
        topic: "Chủ đề 1: Truyền thống nhà trường",
        q: "Nơi cất giữ và trưng bày những thành tích của nhà trường đã đạt được ở",
        opts: [

    function createPRNG(seedStr) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < seedStr.length; i++) {
        h ^= seedStr.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h += 0x6D2B79F5;
        let t = Math.imul(h ^ (h >>> 15), 1 | h);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffleArray(arr, rand) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildExam() {
      const codeSelect = document.getElementById("examCode").value;
      const doShuffleQ = document.getElementById("shuffleQuestions").checked;
      const doShuffleO = document.getElementById("shuffleOptions").checked;

      if (codeSelect === "000") {
        currentSeedCode = "000";
      } else if (codeSelect === "random") {
        currentSeedCode = String(Math.floor(106 + Math.random() * 890));
      } else {
        currentSeedCode = codeSelect;
      }

      const rand = createPRNG("HDTN10_" + currentSeedCode);

      let prepared = RAW_QUESTIONS.map((item) => {
        const mappedOpts = item.opts.map((text, idx) => ({
          text,
          isCorrect: idx === item.ans
        }));

        const finalOpts =
          currentSeedCode !== "000" && doShuffleO && !item.keepOptionOrder
            ? shuffleArray(mappedOpts, rand)
            : mappedOpts;

        return { ...item, shuffledOpts: finalOpts };
      });

      if (currentSeedCode !== "000" && doShuffleQ) {
        prepared = shuffleArray(prepared, rand);
      }

      currentExam = prepared;
      document.getElementById("totalQCountSide").textContent = currentExam.length;
      document.getElementById("totalQCountMob").textContent = currentExam.length;
      document.getElementById("totalQCountModal").textContent = currentExam.length;

      resetStateUI();
      startTimer();
      renderExam();
    }

    function resetStateUI() {
      userAnswers = {};
      isSubmitted = false;
      closeModal("navModal");
      closeModal("confirmModal");

      document.getElementById("currentCodeLabel").textContent = "Mã đề: " + currentSeedCode;
      document.getElementById("mobCodeShort").textContent = "Đề " + currentSeedCode;
      document.getElementById("resCodeText").textContent = "Mã đề " + currentSeedCode;
      document.getElementById("resultBox").classList.remove("show");

      document.getElementById("submitBtnDesktop").disabled = false;
      document.getElementById("endSubmitBtn").disabled = false;
      document.getElementById("mobSubmitBtn").textContent = "✅ Nộp bài";
      document.getElementById("mobSubmitBtn").style.background = "#16a34a";
      document.getElementById("modalSubmitBtn").style.display = "inline-flex";
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerUI();
      timerInterval = setInterval(() => {
        if (!isSubmitted) {
          timerSeconds++;
          updateTimerUI();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
      const s = String(timerSeconds % 60).padStart(2, "0");
      const text = `⏱ ${m}:${s}`;
      document.getElementById("timerLabel").textContent = text;
      document.getElementById("mobTimerLabel").textContent = text;
    }

    function renderExam() {
      const container = document.getElementById("questionsContainer");
      const navDesktop = document.getElementById("navGridDesktop");
      const navMobile = document.getElementById("navGridMobile");
      container.innerHTML = "";
      navDesktop.innerHTML = "";
      navMobile.innerHTML = "";

      currentExam.forEach((qItem, qIndex) => {
        const card = document.createElement("div");
        card.className = "q-card";
        card.id = `q-card-${qIndex}`;

        const topicTag = document.createElement("div");
        topicTag.className = "q-topic";
        topicTag.textContent = qItem.topic;
        card.appendChild(topicTag);

        const title = document.createElement("div");
        title.className = "q-title";
        title.innerHTML = `<span class="q-num">Câu ${qIndex + 1}:</span> ${qItem.q}`;
        card.appendChild(title);

        const optsWrap = document.createElement("div");
        optsWrap.className = "options";

        qItem.shuffledOpts.forEach((opt, optIdx) => {
          const label = document.createElement("label");
          label.className = "opt-label";
          label.id = `opt-${qIndex}-${optIdx}`;

          const input = document.createElement("input");
          input.type = "radio";
          input.name = `question_${qIndex}`;
          input.value = optIdx;
          input.onchange = () => selectOption(qIndex, optIdx);

          const span = document.createElement("span");
          span.innerHTML = `<strong>${LETTERS[optIdx]}.</strong> ${opt.text}`;

          label.appendChild(input);
          label.appendChild(span);
          optsWrap.appendChild(label);
        });

        const feedback = document.createElement("div");
        feedback.className = "q-feedback";
        feedback.id = `feedback-${qIndex}`;

        card.appendChild(optsWrap);
        card.appendChild(feedback);
        container.appendChild(card);

        [navDesktop, navMobile].forEach((grid, gIdx) => {
          const navBtn = document.createElement("button");
          navBtn.className = "nav-item";
          navBtn.id = `nav-${gIdx}-${qIndex}`;
          navBtn.textContent = qIndex + 1;
          navBtn.onclick = () => {
            closeModal("navModal");
            setTimeout(() => {
              document.getElementById(`q-card-${qIndex}`).scrollIntoView({ behavior: "smooth", block: "start" });
            }, 60);
          };
          grid.appendChild(navBtn);
        });
      });

      updateAnsweredCount();
    }

    function selectOption(qIndex, optIdx) {
      const mode = document.getElementById("quizMode").value;
      if (isSubmitted) return;

      userAnswers[qIndex] = optIdx;

      const totalOpts = currentExam[qIndex].shuffledOpts.length;
      for (let i = 0; i < totalOpts; i++) {
        const el = document.getElementById(`opt-${qIndex}-${i}`);
        el.classList.remove("selected", "correct-opt", "wrong-opt");
        if (i === optIdx) el.classList.add("selected");
      }

      [0, 1].forEach((gIdx) => {
        document.getElementById(`nav-${gIdx}-${qIndex}`).classList.add("answered");
      });

      if (mode === "practice") {
        evaluateSingleQuestion(qIndex);
      }

      updateAnsweredCount();
    }

    function evaluateSingleQuestion(qIndex) {
      const qItem = currentExam[qIndex];
      const chosen = userAnswers[qIndex];
      const correctIdx = qItem.shuffledOpts.findIndex((o) => o.isCorrect);
      const fb = document.getElementById(`feedback-${qIndex}`);

      qItem.shuffledOpts.forEach((_, idx) => {
        const el = document.getElementById(`opt-${qIndex}-${idx}`);
        el.classList.remove("selected", "correct-opt", "wrong-opt");
        if (idx === correctIdx) el.classList.add("correct-opt");
        if (chosen !== undefined && idx === chosen && chosen !== correctIdx) {
          el.classList.add("wrong-opt");
        }
      });

      fb.classList.remove("ok", "err", "warn");
      fb.classList.add("show");

      [0, 1].forEach((gIdx) => {
        const navBtn = document.getElementById(`nav-${gIdx}-${qIndex}`);
        navBtn.classList.remove("answered", "correct", "wrong");
        if (chosen !== undefined) {
          navBtn.classList.add(chosen === correctIdx ? "correct" : "wrong");
        }
      });

      if (chosen === undefined) {
        fb.classList.add("warn");
        fb.textContent = `Chưa chọn (Quá lười hoặc quá thật thà) • Đáp án chuẩn SGK là ${LETTERS[correctIdx]}.`;
      } else if (chosen === correctIdx) {
        fb.classList.add("ok");
        fb.textContent = `🎭 +1 điểm Đạo đức giả! (Chuẩn đáp án SGK: ${LETTERS[correctIdx]})`;
      } else {
        fb.classList.add("err");
        fb.textContent = `💎 +1 điểm Sống thật, trung thực! (Nếu thi thật nhớ chọn ${LETTERS[correctIdx]} nhé)`;
      }
    }

    function updateAnsweredCount() {
      const count = Object.keys(userAnswers).length;
      document.getElementById("answeredCount").textContent = count;
      document.getElementById("mobAnsweredCount").textContent = count;
      document.getElementById("modalAnsweredCount").textContent = count;
    }

    function requestSubmit() {
      if (isSubmitted) return;
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < currentExam.length) {
        document.getElementById("confirmMessage").textContent =
          `Bạn mới trả lời ${answeredCount}/${currentExam.length} câu. Muốn nộp bài ngay để đo độ "đạo đức giả" hay "sống thực" luôn không?`;
        openModal("confirmModal");
      } else {
        finalizeSubmit();
      }
    }

    function finalizeSubmit() {
      closeModal("confirmModal");
      if (isSubmitted) return;

      isSubmitted = true;
      clearInterval(timerInterval);

      let correctCount = 0;
      currentExam.forEach((qItem, qIndex) => {
        const correctIdx = qItem.shuffledOpts.findIndex((o) => o.isCorrect);
        if (userAnswers[qIndex] === correctIdx) correctCount++;
        evaluateSingleQuestion(qIndex);

        document.querySelectorAll(`input[name="question_${qIndex}"]`).forEach((inp) => {
          inp.disabled = true;
        });
      });

      const score10 = Number(((correctCount / currentExam.length) * 10).toFixed(2));
      const judgment = getJudgment(score10);

      const rankTitleEl = document.getElementById("rankTitle");
      rankTitleEl.textContent = judgment.title;
      rankTitleEl.className = "rank-title " + judgment.cls;

      document.getElementById("scoreText").textContent = `${score10.toFixed(2)} / 10 điểm "văn mẫu"`;
      document.getElementById("detailText").textContent = `Chuẩn sách giáo khoa: ${correctCount}/${currentExam.length} câu • Độ sống thực: ${currentExam.length - correctCount}/${currentExam.length} câu`;
      document.getElementById("rankRoast").textContent = judgment.roast;
      document.getElementById("resultBox").classList.add("show");

      document.getElementById("submitBtnDesktop").disabled = true;
      document.getElementById("endSubmitBtn").disabled = true;
      document.getElementById("modalSubmitBtn").style.display = "none";

      const mobBtn = document.getElementById("mobSubmitBtn");
      mobBtn.textContent = "🔄 Làm lại";
      mobBtn.style.background = "#7c3aed";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleMobileMainAction() {
      if (isSubmitted) {
        resetCurrentExam();
      } else {
        requestSubmit();
      }
    }

    function resetCurrentExam() {
      resetStateUI();
      startTimer();
      renderExam();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function generateNewRandomCode() {
      document.getElementById("examCode").value = "random";
      buildExam();
    }

    function openNavModal() { openModal("navModal"); }
    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }
    function closeModalOnBackdrop(e, id) {
      if (e.target.id === id) closeModal(id);
    }

    document.getElementById("examCode").addEventListener("change", buildExam);
    document.getElementById("shuffleQuestions").addEventListener("change", buildExam);
    document.getElementById("shuffleOptions").addEventListener("change", buildExam);
    document.getElementById("quizMode").addEventListener("change", resetCurrentExam);

    buildExam();
  </script>
</body>
</html>
